<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinTrack</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="shortcut icon" href="https://img.icons8.com/fluency/96/wallet.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/wallet.png">
  
  <link rel="manifest" href="./manifest.json">

  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0f172a; 
      font-family: sans-serif;
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      display: block;
    }

    /* Banner Install PWA di Level GitHub (Di Atas Iframe) */
    #pwaInstallBanner {
      display: none;
      background: #10b981;
      color: white;
      padding: 12px 16px;
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      z-index: 9999;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13px;
    }
    #pwaInstallBanner span {
      margin-right: 8px;
    }
    #pwaInstallBanner button {
      background: white;
      color: #0f172a;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Banner Install PWA -->
  <div id="pwaInstallBanner">
    <span>Pasang Aplikasi FinTrack?</span>
    <button id="btnPwaInstall">INSTALL</button>
  </div>

  <!-- Iframe Aplikasi Utama -->
  <iframe src="https://script.google.com/macros/s/AKfycbxwzKDNxCUGO_j5OMlWSnha_gEn20O5jm9ce7Cp0bWANBJyLczNuP_hHhe0Vm-G750_/exec" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // 1. Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Terdaftar di GitHub Pages!', reg.scope))
          .catch(err => console.log('Gagal daftar SW:', err));
      });
    }

    // 2. Menangkap Event Install PWA di Window Utama
    let deferredPrompt;
    const pwaBanner = document.getElementById('pwaInstallBanner');
    const btnInstall = document.getElementById('btnPwaInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaBanner.style.display = 'flex'; // Tampilkan banner
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('User response to install prompt:', outcome);
        deferredPrompt = null;
        pwaBanner.style.display = 'none';
      }
    });

    // Sembunyikan banner jika aplikasi sudah berhasil di-install
    window.addEventListener('appinstalled', () => {
      pwaBanner.style.display = 'none';
      console.log('FinTrack berhasil dipasang sebagai PWA!');
    });
  </script>
</body>
</html>
